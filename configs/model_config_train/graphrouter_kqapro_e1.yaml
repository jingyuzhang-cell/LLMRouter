data_path:
  query_data_train: data/kqapro/router_data/query_train.jsonl
  query_data_test: data/kqapro/router_data/query_test.jsonl
  query_embedding_data: data/kqapro/router_data/query_embeddings_longformer.pt
  routing_data_train: data/kqapro/router_data/routing_train.jsonl
  routing_data_test: data/kqapro/router_data/routing_test.jsonl
  llm_data: data/kqapro/router_data/llm_candidates_with_embeddings.json

model_path:
  ini_model_path: ''
  save_model_path: saved_models/graphrouter/kqapro_e1_seed42.pt
  load_model_path: saved_models/graphrouter/kqapro_e1_seed42.pt

metric:
  weights:
    performance: 1
    cost: 0
    llm_judge: 0

hparam:
  hidden_dim: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  train_epoch: 100
  batch_size: 4
  train_mask_rate: 0.3
  val_split_ratio: 0.2
  early_stopping_patience: 20
  early_stopping_min_delta: 0.000001
  random_state: 42
