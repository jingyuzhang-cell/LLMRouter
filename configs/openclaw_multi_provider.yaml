    max_tokens: 512
    context_limit: 131000
    input_price: 0.11
    output_price: 1.1
    auto_routable: false
  glm-5.2:
    provider: zhipu
    provider_type: openai_compatible
    model: glm-5.2
    base_url: https://open.bigmodel.cn/api/paas/v4
    auth_mode: bearer
    chat_path: /chat/completions
    description: Zhipu GLM-5.2 model through BigModel OpenAI-compatible API
    max_tokens: 4096
    context_limit: 1000000
    input_price: 1.4
    output_price: 4.4
    auto_routable: true

  glm-4-flash:
    provider: zhipu
    provider_type: openai_compatible
    model: glm-4-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    auth_mode: bearer
    chat_path: /chat/completions
    description: "Zhipu GLM-4 Flash, fast & cost-efficient"
    max_tokens: 1024
    context_limit: 128000
    input_price: 0.1
    output_price: 0.1

  # ================= OpenAI Models =================
  gpt-4o:
    provider: openai
    provider_type: openai_compatible
    model: gpt-4o
    base_url: https://api.openai.com/v1
    auth_mode: bearer
    chat_path: /chat/completions
