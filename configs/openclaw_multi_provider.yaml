serve:
  host: 127.0.0.1
  port: 8000
  show_model_prefix: true
router:
  strategy: ra_cmcr
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  provider_type: openai_compatible
  auth_mode: bearer
  chat_path: /chat/completions
  llmrouter:
    name: graphrouter
    config_path: configs/model_config_test/multi_provider_graphrouter.yaml
api_keys:
  deepseek: ${DEEPSEEK_API_KEY}
  qwen: ${QWEN_API_KEY}
  doubao: ${DOUBAO_API_KEY}
  gemini: ${GEMINI_API_KEY}
  zhipu: ${ZHIPU_API_KEY}
  openai: ${OPENAI_API_KEY}
memory:
  enabled: false
llms:
  deepseek-chat:
    provider: deepseek
    provider_type: openai_compatible
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    auth_mode: bearer
    chat_path: /chat/completions
    description: DeepSeek chat model
    max_tokens: 1024
    context_limit: 64000
    input_price: 0.28
    output_price: 0.42

  deepseek-coder:
    provider: deepseek
    provider_type: openai_compatible
    model: deepseek-coder
    base_url: https://api.deepseek.com/v1
    auth_mode: bearer
    chat_path: /chat/completions
    description: "DeepSeek code-specialized model"
    max_tokens: 1024
    context_limit: 64000
    input_price: 0.14
    output_price: 0.28

  qwen-plus:
    provider: qwen
    provider_type: openai_compatible
    model: qwen-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    auth_mode: bearer
    chat_path: /chat/completions
    description: Alibaba Cloud Qwen Plus model
    max_tokens: 1024
    context_limit: 131000
    input_price: 0.11
    output_price: 0.28

  qwen-max:
    provider: qwen
    provider_type: openai_compatible
    model: qwen-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    auth_mode: bearer
    chat_path: /chat/completions
    description: "Alibaba Cloud Qwen Max flagship model"
    max_tokens: 1024
    context_limit: 131000
    input_price: 0.56
    output_price: 2.0

  qwen-turbo:
    provider: qwen
    provider_type: openai_compatible
    model: qwen-turbo
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    auth_mode: bearer
    chat_path: /chat/completions
    description: "Alibaba Cloud Qwen Turbo fast & cheap"
    max_tokens: 1024
    context_limit: 131000
    input_price: 0.008
    output_price: 0.02

  doubao:
    provider: doubao
    provider_type: openai_compatible
    model: doubao-seed-evolving
    base_url: https://ark.cn-beijing.volces.com/api/v3
    auth_mode: bearer
    chat_path: /chat/completions
    description: ByteDance Doubao model through Volcano Engine Ark
    max_tokens: 384
    context_limit: 131000
    input_price: 0.11
    output_price: 1.1
    auto_routable: false
  gemini-2.5-flash:
    provider: gemini
    provider_type: openai_compatible
    model: gemini-2.5-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    auth_mode: bearer
    chat_path: /chat/completions
    description: Google Gemini 2.5 Flash model
    max_tokens: 1024
    context_limit: 1000000
    input_price: 0.3
    output_price: 2.5

  gemini-2.5-pro:
    provider: gemini
    provider_type: openai_compatible
    model: gemini-2.5-pro
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    auth_mode: bearer
    chat_path: /chat/completions
    description: "Google Gemini 2.5 Pro, 1M context, top reasoning"
    max_tokens: 4096
    context_limit: 1000000
    input_price: 1.25
    output_price: 5.0

  doubao-seed-2.1-turbo:
    provider: doubao
    provider_type: openai_compatible
    model: doubao-seed-2-1-turbo-260628
    base_url: https://ark.cn-beijing.volces.com/api/v3
    auth_mode: bearer
    chat_path: /chat/completions
