global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: llmrouter-staging
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/llmrouter_metrics_token
    static_configs:
      - targets: ["llmrouter-staging:8001"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
